# Backfills history for packages that evals before #101 could not see:
# top-level packages whose name carries no version nix-env can read
# (`gitwatch`, `dotacat-v0.3.0`, `nix-info`). See backfill.ts.
#
# Dispatch by hand once the forward fix has been imported:
#
#   gh workflow run backfill.yml -f since=2025-10-01 -f through_seq=<seq>
#
# dry_run defaults to true: the import job runs every check and prints the
# counts it would write, then rolls back. Re-run with -f dry_run=false.
#
# through_seq is the last commit imported before eval.nix passed those
# versions, i.e. one less than the first seq with a live range for them:
#
#   SELECT min(r.first_seq) - 1 FROM variant_ranges r
#   JOIN variants va ON va.id = r.variant_id
#   WHERE va.attr_path = 'makeWrapper' AND NOT r.seeded;
#
# (Before the first backfill: it extends that range back. Re-run with the
# same since and through_seq as the first run.)
#
# plan lists the imported commits in the window; eval runs the hidden-only
# expression (`eval.nix --arg hiddenOnly true`, ~15 s and ~3 GB per system)
# for batches of them; import writes the history in one transaction.
#
# A failed fetch or eval fails its batch, and the import refuses to write
# while any (commit, system) in the window lacks an eval: the importer would
# bridge the gap, which can leave ranges too long or not joined to the live
# one. Re-run the workflow (or the failed jobs). -f allow_failed_evals=true
# imports anyway; a later run with every eval repairs what it wrote.
# Re-running the same window writes nothing; a through_seq that is too high
# is refused.
name: backfill

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Oldest nixpkgs commit date to backfill (YYYY-MM-DD)"
        required: true
      through_seq:
        description: "Last commit seq imported before the eval passed hidden versions"
        required: true
      dry_run:
        description: "Run every check and count against the database, then roll back"
        type: boolean
        default: true
      allow_failed_evals:
        description: "Import even if some evals failed, bridging the gaps (a later full run repairs them)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Same Nix as eval.yml, so the entries match what the daily eval lists.
  NIX_VERSION: 2.35.2
  # x86_64-darwin and i686-linux are frozen (#17); see index.yml.
  SYSTEMS: x86_64-linux aarch64-linux aarch64-darwin

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      batches: ${{ steps.list.outputs.batches }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - id: list
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          SINCE: ${{ inputs.since }}
          THROUGH_SEQ: ${{ inputs.through_seq }}
        run: |
          node packages/indexer/dist/cli.js backfill-list \
            --since "$SINCE" --through-seq "$THROUGH_SEQ" --systems "${SYSTEMS// /,}" --batch-size 10

  eval:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # 10 commits x 3 systems: ~10 min.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.batches) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: eval.nix
          sparse-checkout-cone-mode: false

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          nix-package-url: https://releases.nixos.org/nix/nix-${{ env.NIX_VERSION }}/nix-${{ env.NIX_VERSION }}-x86_64-linux.tar.xz

      - name: Evaluate
        env:
          COMMITS: ${{ matrix.commits }}
          BATCH: ${{ matrix.batch }}
        run: |
          set -o pipefail
          mkdir out
          failed=0
          for entry in $COMMITS; do
            hash=${entry%%=*}
            systems=${entry#*=}
            rm -rf nixpkgs && mkdir nixpkgs
            if ! curl -fsSL "https://codeload.github.com/NixOS/nixpkgs/tar.gz/$hash" | tar -xz --strip-components=1 -C nixpkgs; then
              echo "::warning::fetching $hash failed"; failed=$(( failed + 1 )); continue
            fi
            # The daily eval's invocation (eval.yml), plus hiddenOnly.
            config='{ allowInsecure = true; allowInsecurePredicate = (pkg: true); allowUnfree = true; allowUnfreePredicate = (pkg: true); }'
            if [ -f nixpkgs/pkgs/top-level/packages-config.nix ]; then
              config="(import ./nixpkgs/pkgs/top-level/packages-config.nix) // $config"
            fi
            for system in ${systems//,/ }; do
              out="out/hidden-$system-$hash.json.gz"
              if nix-env --file ./eval.nix --query --available --meta --out-path --json \
                   --arg config "$config" --arg hiddenOnly true --argstr system "$system" \
                   2> err.log | gzip > "$out.tmp"; then
                mv "$out.tmp" "$out"
                echo "$hash $system: $(gzip -dc "$out" | jq length) entries"
              else
                # A gap, not an absence: the import refuses it unless allowed.
                rm -f "$out.tmp"; tail -5 err.log
                echo "::warning::eval of $hash/$system failed"; failed=$(( failed + 1 ))
              fi
            done
          done
          echo "failed: $failed" | tee -a "$GITHUB_STEP_SUMMARY"
          # Recorded for the import's gate, and fails the batch.
          echo "$failed" > "out/failed-$BATCH.txt"
          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed evals failed in batch $BATCH"; exit 1
          fi

      # The evals that did succeed, even when some failed: allow_failed_evals
      # imports them, and re-running just the failed jobs keeps the rest.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backfill-${{ matrix.batch }}
          path: out
          if-no-files-found: warn
          retention-days: 7

  import:
    needs: [plan, eval]
    # Runs even when evals failed, to fail loudly in the gate below (or, with
    # allow_failed_evals, import what did evaluate).
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Never alongside the daily import or a migration.
    concurrency:
      group: indexer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - uses: actions/download-artifact@v8
        with:
          pattern: backfill-*
          path: evals
      # Before anything touches the database. The CLI checks again, per
      # (commit, system), against the window itself.
      - name: Gate on failed evals
        env:
          EVAL_RESULT: ${{ needs.eval.result }}
          BATCHES: ${{ needs.plan.outputs.batches }}
          ALLOW_FAILED_EVALS: ${{ inputs.allow_failed_evals }}
        run: |
          expected=$(jq length <<< "$BATCHES")
          reported=0; failed=0
          for f in evals/*/failed-*.txt; do
            [ -f "$f" ] || continue
            reported=$(( reported + 1 )); failed=$(( failed + $(cat "$f") ))
          done
          echo "eval: $EVAL_RESULT; $failed failed evals; $(( expected - reported )) of $expected batches without a report" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$EVAL_RESULT" != "success" ] || [ "$failed" -ne 0 ] || [ "$reported" -ne "$expected" ]; then
            if [ "$ALLOW_FAILED_EVALS" = "true" ]; then
              echo "::warning::importing with failed evals (allow_failed_evals); a full rerun repairs the gaps"
            else
              echo "::error::evals failed; re-run them, or dispatch with allow_failed_evals=true to bridge the gaps"
              exit 1
            fi
          fi
      - name: Backfill
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          SINCE: ${{ inputs.since }}
          THROUGH_SEQ: ${{ inputs.through_seq }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_FAILED_EVALS: ${{ inputs.allow_failed_evals }}
        run: |
          args=(--dir evals --since "$SINCE" --through-seq "$THROUGH_SEQ" --systems "${SYSTEMS// /,}")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$ALLOW_FAILED_EVALS" = "true" ]; then args+=(--allow-failed-evals); fi
          node packages/indexer/dist/cli.js backfill "${args[@]}"
      - name: Summary
        if: always()
        run: node packages/indexer/dist/cli.js status >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
