# Daily nixpkgs indexing: discover -> import -> dispatch.
#
# The eval itself does not run here. Evaluating all of nixpkgs needs ~16 GB,
# and a private repo's runners have 7 GB; the free 4-vCPU/16 GB runners are
# public-repo only. So the eval lives in the public mikeland73/devbox-search-indexer
# repo (one workflow, no application code), which archives each
# (commit, system) eval to R2. This workflow discovers what needs indexing,
# imports whatever the public repo has already archived, and dispatches evals
# for what's still missing.
#
# Import runs BEFORE dispatch on purpose: a commit dispatched today is
# archived in an hour or two and imported by tomorrow's run. That is a day of
# lag in exchange for no polling, no idle runner minutes, and no cross-repo
# callback. Everything here is minutes of standard-runner time.
#
# commit_systems records which (commit, system) pairs landed, so a day where
# one system's eval failed imports the other three and picks up the fourth
# whenever it appears.
name: index

on:
  schedule:
    # 05:00 UTC daily, after the nixpkgs-unstable channel typically advances.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max commits to index this run"
        required: false
        default: "4"

# Serialize with the advisory lock the importer also takes.
concurrency:
  group: indexer
  cancel-in-progress: false

env:
  EVAL_REPO: mikeland73/devbox-search-indexer
  # No x86_64-darwin: nixpkgs 26.11 (unstable since Aug 2026) dropped it and
  # nix-env refuses to evaluate it. Seeded x86_64-darwin data stays as-is;
  # its ranges simply never advance past the seed head.
  SYSTEMS: x86_64-linux aarch64-linux aarch64-darwin

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.discover.outputs.commits }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - id: discover
        # --systems: known commits missing any of these are re-listed for backfill.
        run: node packages/indexer/dist/cli.js discover --limit "${{ inputs.limit || '4' }}" --systems "${SYSTEMS// /,}"
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  import:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      # Pending commits with at least one system not yet archived, and which.
      missing: ${{ steps.fetch.outputs.missing }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      # Pull whatever the public repo has archived for the pending commits
      # into the eval-{system}-{hash}/ layout the importer reads. Absent keys
      # are normal (not evaluated yet) and are left for dispatch. Each commit
      # carries its own system list from discover: all of SYSTEMS for a new
      # release, only the missing ones for a backfill.
      - id: fetch
        name: Fetch archived evals from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          COMMITS: ${{ needs.discover.outputs.commits }}
        run: |
          missing='[]'
          while IFS=$'\t' read -r hash committed_at systems; do
            ts=$(date -u -d "$committed_at" +%s)
            absent='[]'
            for system in $systems; do
              key="$system/$ts-$hash.json.gz"
              dir="evals/eval-$system-$hash"
              if aws --endpoint-url "${{ secrets.R2_ENDPOINT }}" s3 cp "s3://${{ secrets.R2_BUCKET }}/$key" "$dir/eval.json.gz" 2>/dev/null; then
                echo "fetched $key"
              else
                echo "absent  $key"; absent=$(jq -c --arg s "$system" '. + [$s]' <<<"$absent")
              fi
            done
            if [ "$absent" != '[]' ]; then
              missing=$(jq -c --arg h "$hash" --arg d "$committed_at" --argjson s "$absent" '. + [{hash: $h, committedAt: $d, systems: $s}]' <<<"$missing")
            fi
          done < <(jq -r '.[] | "\(.hash)\t\(.committedAt)\t\(.systems | join(" "))"' <<<"$COMMITS")
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "commits still needing eval: $(jq length <<<"$missing")"

      - name: Import
        env:
          # COPY and session advisory locks need the direct (unpooled)
          # endpoint: Neon's pooler is transaction-mode pgbouncer.
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node packages/indexer/dist/cli.js import --dir evals

      - name: Summary
        if: always()
        run: node packages/indexer/dist/cli.js status >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}

  dispatch:
    needs: [discover, import]
    # Dispatch even if import failed: the evals are independent of it, and a
    # commit that is archived but not yet imported is skipped by the
    # `missing` check anyway.
    if: always() && needs.discover.outputs.count != '0' && needs.import.outputs.missing != '' && needs.import.outputs.missing != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch evals in the public repo
        env:
          # Fine-grained PAT, Actions: read/write on EVAL_REPO only. The
          # workflow's own GITHUB_TOKEN cannot dispatch across repos.
          GH_TOKEN: ${{ secrets.INDEXER_DISPATCH_TOKEN }}
          MISSING: ${{ needs.import.outputs.missing }}
        run: |
          while IFS=$'\t' read -r hash committed_at systems; do
            gh workflow run eval.yml -R "$EVAL_REPO" -f "commit=$hash" -f "committed_at=$committed_at" -f "systems=$systems"
            echo "dispatched $hash ($committed_at) $systems" | tee -a "$GITHUB_STEP_SUMMARY"
          done < <(jq -r '.[] | "\(.hash)\t\(.committedAt)\t\(.systems | tojson)"' <<<"$MISSING")
