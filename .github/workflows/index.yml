# Daily nixpkgs indexing: discover -> eval -> import.
#
# discover lists the nixpkgs-unstable releases newer than the database head
# (plus known commits missing a system) and works out which (commit, system)
# evals are not already archived. eval runs nix-env for each of those, one
# job per system, on the public-repo 16 GB runners (see eval.yml). import
# collects everything: the evals this run produced (workflow artifacts) plus
# anything already in the archive for the pending commits, and imports it.
# A commit is searchable minutes after it appears on the channel.
#
# The R2 archive is optional. With it, a commit is never evaluated twice: an
# archive that landed after a previous run failed to import is picked up the
# next day, and a fresh database can import history without re-evaluating.
# Without it, evals travel between jobs as artifacts only and a failed import
# means a re-eval tomorrow. Set R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_ENDPOINT and R2_BUCKET as repository secrets to turn it on; any
# S3-compatible store works.
#
# import runs even when some evals fail, so a day where one system's eval
# fell over still imports the other two. commit_systems records which
# (commit, system) pairs landed and discover --systems re-lists the missing
# one; the run is marked failed afterwards so it shows red.
name: index

on:
  schedule:
    # 05:00 UTC daily, after the nixpkgs-unstable channel typically advances.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        # Cap ~15: a run costs ~5 min of eval (all commits evaluate in
        # parallel) plus ~2 min of import per commit, inside import's
        # 120-minute timeout.
        description: "Max commits to index this run"
        required: false
        default: "4"

permissions:
  contents: read

# Serialize with the advisory lock the importer also takes, and with
# migrate.yml so DDL never runs mid-import.
concurrency:
  group: indexer
  cancel-in-progress: false

env:
  # No x86_64-darwin: nixpkgs 26.11 (unstable since Aug 2026) dropped it and
  # nix-env refuses to evaluate it. Seeded x86_64-darwin data is kept on
  # purpose (#17) so Intel Macs still resolve to the last known state, but
  # the system is deprecated and must not be added back here.
  SYSTEMS: x86_64-linux aarch64-linux aarch64-darwin

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commits: ${{ steps.discover.outputs.commits }}
      count: ${{ steps.discover.outputs.count }}
      evals: ${{ steps.plan.outputs.evals }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - id: discover
        # --systems: known commits missing any of these are re-listed for backfill.
        run: node packages/indexer/dist/cli.js discover --limit "${{ inputs.limit || '4' }}" --systems "${SYSTEMS// /,}"
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Which (commit, system) pairs need an eval: every pending pair unless
      # the archive already has it. Each commit carries its own system list
      # from discover — all of SYSTEMS for a new release, only the missing
      # ones for a backfill. `systems` is emitted as a JSON string because
      # the eval job passes it straight through as a workflow input.
      - id: plan
        name: Plan evals
        env:
          COMMITS: ${{ steps.discover.outputs.commits }}
        run: |
          evals='[]'
          while IFS=$'\t' read -r hash committed_at systems; do
            ts=$(date -u -d "$committed_at" +%s)
            absent='[]'
            for system in $systems; do
              key="$system/$ts-$hash.json.gz"
              if [ -n "$BUCKET" ] && aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$BUCKET" --key "$key" > /dev/null 2>&1; then
                echo "archived $key"
              else
                absent=$(jq -c --arg s "$system" '. + [$s]' <<<"$absent")
              fi
            done
            if [ "$absent" != '[]' ]; then
              echo "eval     $hash ($committed_at) $absent" | tee -a "$GITHUB_STEP_SUMMARY"
              evals=$(jq -c --arg h "$hash" --arg d "$committed_at" --arg s "$absent" '. + [{hash: $h, committedAt: $d, systems: $s}]' <<<"$evals")
            fi
          done < <(jq -r '.[] | "\(.hash)\t\(.committedAt)\t\(.systems | join(" "))"' <<<"$COMMITS")
          echo "evals=$evals" >> "$GITHUB_OUTPUT"
          echo "commits to eval: $(jq length <<<"$evals")"

  eval:
    needs: discover
    # A custom `if` replaces the implicit success() gate, and a discover that
    # died before `plan` leaves `evals` empty — which is != '[]'. Check the
    # result explicitly, like import does, so that fails cleanly as a skip.
    if: needs.discover.result == 'success' && needs.discover.outputs.evals != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.evals) }}
    uses: ./.github/workflows/eval.yml
    with:
      commit: ${{ matrix.hash }}
      committed_at: ${{ matrix.committedAt }}
      systems: ${{ matrix.systems }}
    secrets: inherit

  import:
    needs: [discover, eval]
    # Run when there is anything pending, whether or not every eval succeeded
    # (or any was needed at all).
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    # ~2 min per imported commit; a limit=15 catch-up run stays well inside.
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      BUCKET: ${{ secrets.R2_BUCKET }}
      COMMITS: ${{ needs.discover.outputs.commits }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      # Evals produced by this run, already in the eval-{system}-{hash}/
      # layout the importer reads (eval.yml stages them that way).
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-*
          path: evals

      # Everything else pending comes from the archive: commits evaluated on
      # an earlier run that failed to import, or archived by hand. Absent
      # keys are a failed or slow eval; discover re-lists them tomorrow.
      #
      # eval.yml stamps each object with the `nix --version` that produced it
      # (x-amz-meta-nix-version). It is copied to a sidecar file the importer
      # records on commit_systems, and into the summary, so a Nix upgrade
      # shows up next to the import counts it changed (#22).
      - name: Collect evals
        run: |
          missing=0
          {
            echo "## Evals"
            echo "| commit | system | source | nix |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r hash committed_at systems; do
            ts=$(date -u -d "$committed_at" +%s)
            for system in $systems; do
              dir="evals/eval-$system-$hash"
              key="$system/$ts-$hash.json.gz"
              if [ -f "$dir/eval.json.gz" ]; then
                nix_version=$(cat "$dir/nix-version" 2>/dev/null || true)
                echo "artifact $key (nix ${nix_version:-unknown})"
                echo "| \`${hash:0:12}\` | $system | artifact | ${nix_version:-unknown} |" >> "$GITHUB_STEP_SUMMARY"
              elif [ -n "$BUCKET" ] && aws --endpoint-url "$ENDPOINT" s3 cp "s3://$BUCKET/$key" "$dir/eval.json.gz" 2>/dev/null; then
                nix_version=$(aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$BUCKET" --key "$key" | jq -r '.Metadata["nix-version"] // empty')
                if [ -n "$nix_version" ]; then echo "$nix_version" > "$dir/nix-version"; fi
                echo "archive  $key (nix ${nix_version:-unknown})"
                echo "| \`${hash:0:12}\` | $system | archive | ${nix_version:-unknown} |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "absent   $key"; missing=$(( missing + 1 ))
                echo "| \`${hash:0:12}\` | $system | _missing_ | |" >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          done < <(jq -r '.[] | "\(.hash)\t\(.committedAt)\t\(.systems | join(" "))"' <<<"$COMMITS")
          echo "evals still missing: $missing"

      - name: Import
        env:
          # COPY and session advisory locks need the direct (unpooled)
          # endpoint: Neon's pooler is transaction-mode pgbouncer.
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: node packages/indexer/dist/cli.js import --dir evals

      - name: Summary
        if: always()
        run: node packages/indexer/dist/cli.js status >> "$GITHUB_STEP_SUMMARY"
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}

      - name: Fail if an eval failed
        if: needs.eval.result == 'failure'
        run: |
          echo "::error::one or more evals failed; whatever landed was imported and discover re-lists the rest tomorrow"
          exit 1
