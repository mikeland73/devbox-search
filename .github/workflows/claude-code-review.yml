name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # Skip drafts and PRs opened by bots
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review PR
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Posts a tracking comment and updates it as the review proceeds
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on:

            1. **Correctness** — logic errors, unhandled edge cases, race
               conditions, incorrect error handling.
            2. **Security** — unvalidated input, injection, leaked secrets,
               missing authn/authz checks.
            3. **Performance** — N+1 queries, unnecessary work in hot paths,
               unbounded memory growth.
            4. **Tests** — missing coverage for new behavior and edge cases.
            5. **Maintainability** — naming, dead code, duplication, anything
               that diverges from conventions already used in this repo.

            Only comment on things that are actually wrong or genuinely risky.
            Do not nitpick style that a formatter or linter already handles,
            and do not restate what the diff does.

            Use inline comments for specific lines. Use one top-level comment
            for overall observations. If the PR looks good, say so briefly.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
