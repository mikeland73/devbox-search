# Applies pending schema migrations to the Neon database.
#
# Runs on every merge to main that touches packages/db/drizzle/, so a PR that
# ships a migration also ships its deployment — the importer on the next
# daily run finds the columns it expects. Also runs on demand; an up-to-date
# database is a no-op that says "up to date".
name: migrate

on:
  push:
    branches: [main]
    paths:
      - packages/db/drizzle/**
      - .github/workflows/migrate.yml
  workflow_dispatch:

permissions:
  contents: read

# Never run DDL mid-import: ADD CONSTRAINT takes an exclusive lock on a 3.8M-row
# table. Same group as index.yml, so the two serialize across workflows.
concurrency:
  group: indexer
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Direct (unpooled) endpoint, same secret index.yml imports with: drizzle's
      # migrator runs in a transaction, which Neon's transaction-mode pooler does
      # not support.
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # migrate.js needs the core -> db dist chain, not the whole workspace.
      - run: pnpm --filter "@devbox-search/db..." build

      - name: Migrate
        run: |
          set -o pipefail
          node packages/db/dist/migrate.js | tee -a "$GITHUB_STEP_SUMMARY"
